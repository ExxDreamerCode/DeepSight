name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the Qt libraries PyQt6 needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 fonts-dejavu-core

      - name: Run Qt headless
        if: runner.os != 'Windows'
        run: echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"

      - name: Install the dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run the test suite
        run: python -m pytest -q

  engines:
    name: End-to-end (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: windows-x86_64
            runner: windows-latest
          - target: macos-arm64
            runner: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the Qt libraries PyQt6 needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 fonts-dejavu-core

      - name: Run Qt headless
        if: runner.os != 'Windows'
        run: echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"

      - name: Install the dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Fetch the engines this build ships
        run: python Engines/fetch_engines.py --target ${{ matrix.target }}

      - name: Check that the engines answer UCI
        run: python main.py --self-check self-check.json

      - name: Show the self-check report
        run: python -c "print(open('self-check.json', encoding='utf-8').read())"

      - name: Play the end-to-end games with Ember
        env:
          DEEPSIGHT_RUN_ENGINE_TESTS: "1"
          DEEPSIGHT_ENGINE: ember
        run: python -m pytest -q tests/test_integration_engine.py tests/test_self_check.py

      - name: Play the end-to-end games with Stockfish
        env:
          DEEPSIGHT_RUN_ENGINE_TESTS: "1"
          DEEPSIGHT_ENGINE: stockfish
        run: python -m pytest -q tests/test_integration_engine.py tests/test_self_check.py
